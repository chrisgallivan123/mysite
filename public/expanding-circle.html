<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; display: flex; align-items: center; justify-content: center; height: 700px; width: 700px; }
  svg { display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 700 700" width="700" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="700" height="700" fill="#fff"/>

  <!-- Ring 5 (outermost): Fundamentally expensive -->
  <circle cx="350" cy="340" r="310" fill="#f9f5f5" stroke="#e8dede" stroke-width="1"/>

  <!-- Ring 4: Cheap if friction removed -->
  <circle cx="350" cy="340" r="248" fill="#f3e4e4" stroke="#e0cccc" stroke-width="0.5"/>

  <!-- Ring 3: Cheap if automated -->
  <circle cx="350" cy="340" r="190" fill="#e8cccc" stroke="#d4b3b3" stroke-width="0.5"/>

  <!-- Ring 2: Cheap if pre-computed -->
  <circle cx="350" cy="340" r="135" fill="#d4a0a0" stroke="#c08888" stroke-width="0.5"/>

  <!-- Ring 1 (center): Already nudgeable -->
  <circle cx="350" cy="340" r="80" fill="#8b2020" stroke="none"/>

  <!-- Center text -->
  <text x="350" y="333" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#fff">Already</text>
  <text x="350" y="353" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#fff">nudgeable</text>

  <!-- Ring 2 text — centered in the band between r=80 and r=135, so midpoint ~107 from center -->
  <!-- Place at top of ring for readability -->
  <text x="350" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#5a1a1a">Cheap if pre-computed</text>
  <text x="350" y="263" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8a5050" font-style="italic">AI delivers analysis ready-made</text>

  <!-- Ring 3 text — centered in band between r=135 and r=190, midpoint ~162 -->
  <text x="350" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#5a1a1a">Cheap if automated</text>
  <text x="350" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8a5050" font-style="italic">AI drafts the message, creates the ticket</text>

  <!-- Ring 4 text — centered in band between r=190 and r=248, midpoint ~219 -->
  <text x="350" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#5a1a1a">Cheap if friction removed</text>
  <text x="350" y="123" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8a5050" font-style="italic">AI handles cross-tool coordination</text>

  <!-- Ring 5 text (outermost) — centered in band between r=248 and r=310, midpoint ~279 -->
  <text x="350" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#9a7070">Fundamentally expensive</text>
  <text x="350" y="63" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#b09090" font-style="italic">Not nudgeable — needs a different lever</text>

  <!-- Arrow annotation -->
  <line x1="68" y1="120" x2="100" y2="160" stroke="#8b2020" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b2020"/>
    </marker>
  </defs>
  <text x="66" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8b2020">AI widens</text>
  <text x="66" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8b2020">the circle</text>
</svg>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="300" fill="white"/>

  <!-- Arrows between panels -->
  <line x1="280" y1="135" x2="320" y2="135" stroke="#ccc" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="135" x2="620" y2="135" stroke="#ccc" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ccc"/>
    </marker>
  </defs>

  <!-- Panel 1: Dashboard -->
  <rect x="30" y="35" width="240" height="200" rx="12" fill="white" stroke="#ddd" stroke-width="1.5"/>

  <!-- Chart icon -->
  <rect x="100" y="75" width="20" height="60" rx="3" fill="#ccc"/>
  <rect x="130" y="55" width="20" height="80" rx="3" fill="#bbb"/>
  <rect x="160" y="90" width="20" height="45" rx="3" fill="#ccc"/>

  <text x="150" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#999">Dashboard</text>
  <text x="150" y="185" text-anchor="middle" font-size="12" fill="#aaa">You stare at it</text>
  <text x="150" y="200" text-anchor="middle" font-size="12" fill="#aaa">It stares back</text>

  <!-- Panel 2: Genie -->
  <rect x="330" y="35" width="240" height="200" rx="12" fill="white" stroke="#ddd" stroke-width="1.5"/>

  <!-- Chat bubble icon -->
  <rect x="395" y="60" width="100" height="50" rx="10" fill="none" stroke="#bbb" stroke-width="2"/>
  <text x="445" y="90" text-anchor="middle" font-size="11" fill="#aaa">Ask me anything</text>
  <polygon points="420,110 430,110 415,125" fill="none" stroke="#bbb" stroke-width="2"/>

  <text x="450" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#999">Genie</text>
  <text x="450" y="185" text-anchor="middle" font-size="12" fill="#aaa">You find the lamp</text>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#aaa">You ask the question</text>

  <!-- Panel 3: Trainer -->
  <rect x="630" y="35" width="240" height="200" rx="12" fill="white" stroke="#8B1A1A" stroke-width="2.5"/>

  <!-- Person + clock icon -->
  <circle cx="740" cy="70" r="14" fill="none" stroke="#8B1A1A" stroke-width="2.5"/>
  <line x1="740" y1="84" x2="740" y2="115" stroke="#8B1A1A" stroke-width="2.5"/>
  <line x1="740" y1="95" x2="720" y2="108" stroke="#8B1A1A" stroke-width="2.5"/>
  <line x1="740" y1="95" x2="760" y2="108" stroke="#8B1A1A" stroke-width="2.5"/>

  <!-- Small clock next to person -->
  <circle cx="785" cy="78" r="12" fill="none" stroke="#8B1A1A" stroke-width="1.5"/>
  <line x1="785" y1="78" x2="785" y2="70" stroke="#8B1A1A" stroke-width="1.5"/>
  <line x1="785" y1="78" x2="791" y2="78" stroke="#8B1A1A" stroke-width="1.5"/>

  <text x="750" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#8B1A1A">Intervention</text>
  <text x="750" y="185" text-anchor="middle" font-size="12" fill="#8B1A1A">Shows up where you are</text>
  <text x="750" y="200" text-anchor="middle" font-size="12" fill="#8B1A1A">When acting costs nothing</text>

  <!-- Bottom label -->
  <text x="150" y="270" text-anchor="middle" font-size="11" fill="#bbb">INFORMATION</text>
  <text x="450" y="270" text-anchor="middle" font-size="11" fill="#bbb">INTERACTION</text>
  <text x="750" y="270" text-anchor="middle" font-size="11" fill="#8B1A1A" font-weight="600">INTERVENTION</text>

  <!-- Progression line -->
  <line x1="60" y1="255" x2="840" y2="255" stroke="#eee" stroke-width="1"/>
</svg>